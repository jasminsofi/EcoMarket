<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Contacto</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="../index.html" class="logo-link">
                <img src="../img/logo.svg" alt="EcoMarket Logo" style="height: 38px;">
            </a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="sobre-nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <input type="text" placeholder="Buscar..." class="search-bar">
            <a href="#" class="cart-icon">🛒 <span class="badge">3</span></a>
        </div>
    </header>

    <main class="contact-container" style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
        <h2>Ponte en Contacto</h2>
        <div class="contact-grid" style="display: flex; gap: 2rem; margin-top: 1.5rem; flex-wrap: wrap;">
            <!-- Formulario Inteligente (Validación CSS) -->
            <form class="contact-form" style="flex: 1; min-width: 300px;">
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="nombre" style="margin-bottom: 0.3rem; font-weight: bold;">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Tu nombre" style="padding: 0.6rem; border: 1px solid #bdc3c7; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="email" style="margin-bottom: 0.3rem; font-weight: bold;">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com" style="padding: 0.6rem; border: 1px solid #bdc3c7; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="mensaje" style="margin-bottom: 0.3rem; font-weight: bold;">Mensaje</label>
                    <textarea id="mensaje" rows="5" required placeholder="Escribe tu mensaje..." style="padding: 0.6rem; border: 1px solid #bdc3c7; border-radius: 4px;"></textarea>
                </div>
                <button type="submit" class="btn-cta">Enviar Mensaje</button>
            </form>

            <!-- Ubicación y Redes -->
            <div class="contact-info" style="flex: 1; min-width: 300px;">
                <h3>Nuestra Ubicación</h3>
                <div class="map-container" style="margin: 1rem 0;">
                    <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=500&q=80" alt="Mapa de Ubicación" style="width: 100%; border-radius: 8px; height: 200px; object-fit: cover;">
                </div>
                <h3>Síguenos</h3>
                <div class="social-icons" style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                    <a href="#" class="social-btn">🌐 Facebook</a>
                    <a href="#" class="social-btn">📸 Instagram</a>
                    <a href="#" class="social-btn">🐦 Twitter</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 EcoMarket. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
